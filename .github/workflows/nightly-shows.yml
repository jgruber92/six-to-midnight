# Every night: read the band's Google Sheet of shows and, if anything changed, rebuild the
# calendar files (cal/) and Google's show listings, then publish. The band edits the Sheet;
# nobody has to touch the code. Also runs Mondays even without changes, so past shows drop off.
# Runs on GitHub's computers, not a laptop: nothing needs to be on.
# Run it right now: GitHub > Actions > "Nightly shows update" > Run workflow.
# The scripts in .github/build/ are copied here by scripts/publish.sh. Edit the originals in scripts/.
name: Nightly shows update
on:
  schedule:
    - cron: "17 8 * * *" # about 3 to 4am Eastern
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: nightly-shows
jobs:
  shows:
    runs-on: ubuntu-latest
    env:
      SITE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read the Sheet
        id: sync
        run: |
          node .github/build/sync_gigs.js
          if git diff --quiet -- js/gigs-data.js && [ "$(date -u +%u)" != "1" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild calendar files and Google show listings
        if: steps.sync.outputs.changed == 'yes'
        run: |
          node .github/build/make_ics.js
          node .github/build/make_seo.js
      - name: Publish
        id: push
        if: steps.sync.outputs.changed == 'yes'
        run: |
          git config user.name "Nightly shows update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -qm "Nightly: shows from the Sheet"
          git push -q
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
      # GitHub pauses scheduled jobs in a public repo after 60 days with no commits. Shows rebuilt
      # on Mondays usually commit, but a quiet stretch (no upcoming shows) wouldn't. So once a month
      # (and on the very first run) commit a one-line date file. Visitors never see it.
      - name: Monthly heartbeat (keeps this job from being paused)
        if: steps.push.outputs.pushed != 'yes'
        run: |
          f=.github/heartbeat.txt
          if [ -f "$f" ] && [ "$(date -u +%d)" != "01" ]; then exit 0; fi
          date -u +%F > "$f"
          git config user.name "Nightly shows update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f" && git commit -qm "Nightly: monthly heartbeat" && git push -q && echo "Heartbeat committed."
      # GitHub Pages sites: make sure Pages rebuilds (Cloudflare sites rebuild on the push by themselves).
      - name: Rebuild GitHub Pages
        if: steps.push.outputs.pushed == 'yes' && hashFiles('CNAME') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null && echo "Pages rebuild requested."
