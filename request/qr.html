<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Card (QR) | Six to Midnight</title>
<meta name="description" content="Printable table card with a QR code that opens the Six to Midnight song request page.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Six to Midnight">
<meta property="og:title" content="Request a song from Six to Midnight">
<meta property="og:description" content="Scan it. Name it. Yell for it.">
<meta property="og:image" content="https://jgruber92.github.io/six-to-midnight/img/og.jpg">
<meta property="og:url" content="https://jgruber92.github.io/six-to-midnight/request/qr.html">
<link rel="canonical" href="https://jgruber92.github.io/six-to-midnight/request/qr.html">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Six to Midnight on stage at Brother's Tavern in Milford">
<meta name="theme-color" content="#0A0710">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="qrpage">
<div class="qbar">
  <p>Table card, 4x6 in. The QR code points at this site's own <a href="./">request page</a>, so it stays right when the site moves. Printing switches to black on white. 2 per page: about 3.5 x 5.3 in each, cut along the middle.</p>
  <div class="ctrls">
    <label><input type="checkbox" id="bw"> Black on white (saves ink)</label>
    <label><input type="checkbox" id="two"> 2 per page</label>
    <button class="btn btn-hot btn-sm" type="button" id="print">Print this card</button>
  </div>
</div>
<main class="qcards">
<div class="qcard">
  <img class="logo logo-light" src="../img/logo.svg" alt="Six to Midnight" width="104" height="91">
  <img class="logo logo-dark" src="../img/logo-black.svg" alt="Six to Midnight" width="104" height="91">
  <p class="ruled">Six to Midnight</p>
  <h1>Request <span>a song</span></h1>
  <p class="line">Scan it. Name it. Yell for it.</p>
  <div class="qr" id="qr"></div>
  <p class="url" id="url"></p>
  <p class="boxed">90s &amp; 2000s Rock</p>
</div>
</main>
<script src="../js/config.js?v=3"></script>
<script src="../js/qrcode.js"></script>
<script>
(function(){
  // This card lives at /request/qr.html, so the request page is its own folder.
  var target=new URL("./",location.href).href;
  var short=target.replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/\/$/,"");
  var box=document.getElementById("qr");
  try{
    var q=window.STMQR.make(target,"M"),n=q.getModuleCount(),d="",pad=2,size=n+pad*2;
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+pad)+" "+(r+pad)+"h1v1h-1z";
    box.innerHTML='<svg viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges" role="img" aria-label="QR code for '+short+'"><rect width="'+size+'" height="'+size+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  }catch(e){box.innerHTML='<p style="color:#000;font-size:.8rem">QR code could not be made. Use the link below.</p>';}
  document.getElementById("url").textContent=short;
  var site=(window.STM||{}).siteUrl;
  if(site){var og=document.querySelector('meta[property="og:image"]');if(og)og.setAttribute("content",site.replace(/\/?$/,"/")+"img/og.jpg");}
  // "2 per page": a second copy of the card (hidden from screen readers)
  var card=document.querySelector(".qcard"),copy=card.cloneNode(true);
  copy.classList.add("copy");copy.setAttribute("aria-hidden","true");
  copy.querySelectorAll("[id]").forEach(function(el){el.removeAttribute("id")});
  copy.querySelector("h1").outerHTML='<p class="h1like">'+copy.querySelector("h1").innerHTML+'</p>';
  card.parentNode.appendChild(copy);
  var two=document.getElementById("two");
  two.addEventListener("change",function(){document.body.classList.toggle("two",two.checked)});
  var bw=document.getElementById("bw");
  bw.addEventListener("change",function(){document.body.classList.toggle("bw",bw.checked)});
  document.getElementById("print").addEventListener("click",function(){window.print()});
  addEventListener("beforeprint",function(){document.body.classList.add("bw")});
  addEventListener("afterprint",function(){document.body.classList.toggle("bw",bw.checked)});
})();
</script>
</body>
</html>
